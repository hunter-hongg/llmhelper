[package]
name = "llmhelper"
version = "0.1.0"
edition = "2021"
description = "Agent/LLM usage introspection and OpenAI-compatible chat requests from the terminal"
keywords = ["llm", "agent", "usage", "cli", "tui", "ratatui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
ratatui = "0.29"
unicode-width = "0.2"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dirs = "6"
anyhow = "1"
parking_lot = "0.12"
reqwest = { version = "0.11", features = ["json", "stream"] }

# Restore the default SIGPIPE disposition on Unix so `llmhelper ... | head`
# terminates quietly instead of panicking on the first failed stdout write.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
